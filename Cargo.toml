[workspace]
resolver = "3"
members = ["crates/sanctuary-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Frank Gomez"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.34"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
